<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Hub</title>
  <meta name="description" content="Catalogue centralisé des extensions TurboWarp, PenguinMod, SharkPool, Mistium et autres.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#"><span>◆</span> Extension Hub</a>
    <div class="status" id="status">Synchronisation…</div>
  </header>

  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">EXTENSIONS POUR SCRATCH MODS</p>
        <h1>Toutes tes extensions,<br><em>au même endroit.</em></h1>
        <p class="lead">TurboWarp, PenguinMod, SharkPool, Mistium et d'autres collections, avec un catalogue mis à jour automatiquement.</p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Rechercher une extension…" autocomplete="off">
      <select id="source">
        <option value="">Toutes les sources</option>
      </select>
      <select id="category">
        <option value="">Toutes les catégories</option>
      </select>
      <button id="refresh">↻ Actualiser</button>
    </section>

    <section class="meta-row">
      <span id="count">0 extension</span>
      <span id="updated"></span>
    </section>

    <section class="grid" id="grid"></section>
    <p class="empty" id="empty" hidden>Aucune extension ne correspond à ta recherche.</p>
  </main>

  <dialog id="details">
    <button class="close" id="close">×</button>
    <div id="detailsContent"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
