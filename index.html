<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension Hub</title>
  <meta name="description" content="Catalogue centralisé des extensions TurboWarp, PenguinMod, SharkPool, Mistium et autres.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="#">
        <svg class="logo" width="32" height="32" viewBox="0 0 32 32">
          <rect x="2" y="2" width="12" height="12" fill="currentColor"/>
          <rect x="18" y="2" width="12" height="12" fill="currentColor"/>
          <rect x="2" y="18" width="12" height="12" fill="currentColor"/>
          <rect x="18" y="18" width="12" height="12" fill="currentColor"/>
        </svg>
        Extension Hub
      </a>
    </div>
    <div class="topbar-right">
      <div class="status" id="status">Synchronisation…</div>
      <button id="refresh" class="refresh-btn" title="Actualiser">↻</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <h1>Extensions pour Scratch</h1>
        <p>Découvre et utilise les meilleures extensions TurboWarp, PenguinMod, SharkPool, Mistium et plus.</p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Rechercher une extension…" autocomplete="off">
      <div class="select-group">
        <select id="source">
          <option value="">Toutes les sources</option>
        </select>
      </div>
      <div class="select-group">
        <select id="category">
          <option value="">Toutes les catégories</option>
        </select>
      </div>
    </section>

    <section class="meta-row">
      <span id="count">0 extension</span>
      <span id="updated"></span>
    </section>

    <section class="grid" id="grid"></section>
    <p class="empty" id="empty" hidden>Aucune extension ne correspond à ta recherche.</p>
  </main>

  <dialog id="details" class="details-modal">
    <div class="details-wrapper">
      <button class="close" id="close">×</button>
      <div id="detailsContent"></div>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
